name: Sift protocol schema artifacts

# Branch push is intentional: a new workflow cannot be manually dispatched from
# the default branch before it exists there. Review this source before pushing.
on:
  push:
    branches: [codex/worker-policy, codex/worker-policy-schema]
    paths:
      - .github/workflows/sift-schema-fixtures.yml
      - codex-rs/app-server-protocol/**
      - codex-rs/protocol/**
      - codex-rs/Cargo.toml
      - codex-rs/Cargo.lock
      - codex-rs/rust-toolchain.toml

permissions:
  contents: read

concurrency:
  group: sift-schema-fixtures-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.repository == 'Tom-R-Main/codex'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
      SOURCE_SHA: ${{ github.sha }}
    steps:
      - name: Initialize temporary paths
        shell: bash
        run: |
          set -euo pipefail
          printf 'CARGO_TARGET_DIR=%s/sift-schema-target\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'SCHEMA_OUTPUT=%s/sift-schema-output\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
          printf 'ARTIFACT_OUTPUT=%s/sift-schema-artifact\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e081816240890017053eacbb1bdf337761dc5582 # 1.95.0
      - name: Freeze source and toolchain identities
        id: freeze
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode().strip()
          head = git('rev-parse', 'HEAD')
          if head != os.environ['SOURCE_SHA'] or git('status', '--porcelain'):
              raise SystemExit('Source checkout binding refused')
          output = pathlib.Path(os.environ['SCHEMA_OUTPUT'])
          artifact = pathlib.Path(os.environ['ARTIFACT_OUTPUT'])
          output.mkdir(mode=0o700)
          artifact.mkdir(mode=0o700)
          names = subprocess.check_output(['git', 'ls-files', '-z', 'codex-rs', '.github/workflows/sift-schema-fixtures.yml']).decode().split('\0')
          selected = sorted(p for p in names if p and (
              p.startswith('codex-rs/app-server-protocol/') or
              p.endswith('/Cargo.toml') or p in [
                  'codex-rs/Cargo.lock', 'codex-rs/rust-toolchain.toml',
                  '.github/workflows/sift-schema-fixtures.yml']))
          files = []
          for name in selected:
              path = pathlib.Path(name)
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('Source inventory file type refused')
              data = path.read_bytes()
              files.append({'path': name, 'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()})
          receipt = {'version': 1, 'purpose': 'protocol-schema-generation-only',
                     'sourceCommit': head, 'sourceTree': git('rev-parse', 'HEAD^{tree}'),
                     'runId': os.environ['GITHUB_RUN_ID'], 'runAttempt': os.environ['GITHUB_RUN_ATTEMPT'],
                     'rustc': subprocess.check_output(['rustc', '--version']).decode().strip(),
                     'cargo': subprocess.check_output(['cargo', '--version']).decode().strip(),
                     'sourceFiles': files, 'qualification': 'Generation only; not a protocol test-suite pass'}
          (artifact / 'source-manifest.json').write_text(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
          PY
      - name: Generate stable and experimental protocol schemas with locked dependencies
        working-directory: codex-rs
        shell: bash
        run: |
          set -euo pipefail
          # Same ignored writer invoked by write_schema_fixtures.py, with --locked.
          # Scratch output avoids that wrapper's separate Python SDK regeneration.
          unset CODEX_APP_SERVER_SCHEMA_PRETTIER
          export CODEX_APP_SERVER_SCHEMA_ROOT="$SCHEMA_OUTPUT/schema"
          for mode in 0 1; do
            export CODEX_APP_SERVER_SCHEMA_EXPERIMENTAL="$mode"
            set +e
            cargo test --locked -p codex-app-server-protocol --lib \
              schema_fixtures_tests::write_schema_fixtures_from_env -- --exact --ignored \
              2>&1 | head -c 16777217 > "$SCHEMA_OUTPUT/generator-$mode.log"
            pipeline_status=("${PIPESTATUS[@]}")
            set -e
            GENERATOR_MODE="$mode" GENERATOR_EXIT="${pipeline_status[0]}" \
              CAPTURE_EXIT="${pipeline_status[1]}" python3 - <<'PY'
          import hashlib, json, os, pathlib, re
          mode = os.environ['GENERATOR_MODE']
          output = pathlib.Path(os.environ['SCHEMA_OUTPUT'])
          log = output / f'generator-{mode}.log'
          data = log.read_bytes()  # head above caps this at 16 MiB + one sentinel byte.
          text = data.decode('utf-8', errors='replace')
          summaries = re.findall(r'^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out;.*$', text, re.MULTILINE)
          writers = re.findall(r'^test schema_fixtures_tests::write_schema_fixtures_from_env \.\.\. ok$', text, re.MULTILINE)
          exit_code = int(os.environ['GENERATOR_EXIT'])
          capture_exit = int(os.environ['CAPTURE_EXIT'])
          passed = (len(data) <= 16 * 1024**2 and exit_code == 0 and capture_exit == 0 and
                    len(summaries) == 1 and len(writers) == 1 and
                    summaries[0][:5] == ('ok', '1', '0', '0', '0'))
          artifact = pathlib.Path(os.environ['ARTIFACT_OUTPUT'])
          source_bytes = (artifact / 'source-manifest.json').read_bytes()
          source_receipt = json.loads(source_bytes)
          result = {'experimentalMode': mode, 'exitCode': exit_code, 'captureExitCode': capture_exit,
                    'outputBytes': len(data), 'outputSha256': hashlib.sha256(data).hexdigest(),
                    'outputTruncated': len(data) > 16 * 1024**2,
                    'sourceCommit': source_receipt['sourceCommit'], 'sourceTree': source_receipt['sourceTree'],
                    'sourceManifestSha256': hashlib.sha256(source_bytes).hexdigest(),
                    'command': ['cargo', 'test', '--locked', '-p', 'codex-app-server-protocol', '--lib',
                                'schema_fixtures_tests::write_schema_fixtures_from_env', '--', '--exact', '--ignored'],
                    'writer': 'schema_fixtures_tests::write_schema_fixtures_from_env',
                    'exactWriterCensusPassed': passed, 'summaryCount': len(summaries),
                    'writerOkCount': len(writers),
                    'qualification': 'Generation receipt only; not a test-suite pass'}
          for index, name in enumerate(['passed', 'failed', 'ignored', 'measured', 'filteredOut'], 1):
              result[name] = int(summaries[0][index]) if len(summaries) == 1 else None
          encoded = json.dumps(result, sort_keys=True) + '\n'
          (output / f'generator-{mode}.json').write_text(encoded)
          (artifact / f'generator-{mode}-result.json').write_text(encoded)
          if not passed:
              print('Generator failure receipt: ' + encoded, flush=True)
              # Public source/compiler output only: no environment or credential dump.
              # Keep raw diagnostics in job output, never in the artifact payload.
              for line in '\n'.join(text.splitlines()[-200:])[-32768:].splitlines():
                  print('cargo diagnostic: ' + line)
              raise SystemExit('Exact one-writer generator census refused')
          PY
          done
      - name: Validate bounded artifact inventory and unchanged source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, stat, subprocess
          source = pathlib.Path(os.environ['SCHEMA_OUTPUT']) / 'schema'
          artifact = pathlib.Path(os.environ['ARTIFACT_OUTPUT'])
          receipt = json.loads((artifact / 'source-manifest.json').read_text())
          if subprocess.check_output(['git', 'status', '--porcelain']).strip():
              raise SystemExit('Generation changed the source checkout')
          for item in receipt['sourceFiles']:
              path = pathlib.Path(item['path'])
              if path.is_symlink() or hashlib.sha256(path.read_bytes()).hexdigest() != item['sha256']:
                  raise SystemExit('Generation changed frozen source bytes')
          bundles = {'precomputed/app-server-exports-stable.json.zst',
                     'precomputed/app-server-exports-experimental.json.zst'}
          required = bundles | {'typescript/index.ts', 'typescript/v2/SiftCommandScope.ts',
                                'json/codex_app_server_protocol.schemas.json',
                                'json/CommandExecutionRequestApprovalParams.json'}
          records, total = [], 0
          for path in sorted(source.rglob('*')):
              mode = path.lstat().st_mode
              if stat.S_ISLNK(mode) or not (stat.S_ISDIR(mode) or stat.S_ISREG(mode)) or (stat.S_ISREG(mode) and path.lstat().st_nlink != 1):
                  raise SystemExit('Generated artifact file type refused')
              if stat.S_ISDIR(mode):
                  continue
              name = path.relative_to(source).as_posix()
              allowed = ((name.startswith('typescript/') and name.endswith('.ts')) or
                         (name.startswith('json/') and name.endswith('.json')) or name in bundles)
              size = path.stat().st_size
              total += size
              if not allowed or not re.fullmatch(r'[A-Za-z0-9_./-]+', name) or not 0 < size <= 8 * 1024**2 or total > 32 * 1024**2 or len(records) >= 4096:
                  raise SystemExit('Generated artifact bounds refused')
              data = path.read_bytes()
              if len(data) != size:
                  raise SystemExit('Generated artifact changed during inventory')
              if name.endswith('.json'):
                  json.loads(data)
              elif name.endswith('.ts'):
                  data.decode('utf-8')
              elif not data.startswith(bytes.fromhex('28b52ffd')):
                  raise SystemExit('Generated export is not a zstd frame')
              destination = artifact / 'schema' / name
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              records.append({'path': 'schema/' + name, 'bytes': size, 'sha256': hashlib.sha256(data).hexdigest()})
          if not required.issubset({row['path'].removeprefix('schema/') for row in records}):
              raise SystemExit('Required generated schema outputs are absent')
          manifest = {'version': 1, 'sourceCommit': receipt['sourceCommit'],
                      'sourceTree': receipt['sourceTree'], 'runId': receipt['runId'],
                      'runAttempt': receipt['runAttempt'],
                      'sourceManifestSha256': hashlib.sha256((artifact / 'source-manifest.json').read_bytes()).hexdigest(),
                      'commands': [['cargo', 'test', '--locked', '-p', 'codex-app-server-protocol', '--lib',
                                    'schema_fixtures_tests::write_schema_fixtures_from_env', '--', '--exact', '--ignored']],
                      'experimentalModes': ['0', '1'],
                      'generatorResults': [json.loads((source.parent / f'generator-{mode}.json').read_text()) for mode in ['0', '1']],
                      'fileCount': len(records), 'totalBytes': total,
                      'files': records, 'qualification': 'Generated artifacts only; test-suite and semantic review still required'}
          (artifact / 'artifact-manifest.json').write_text(json.dumps(manifest, sort_keys=True, indent=2) + '\n')
          PY
      - name: Export generated schema files and binding manifests only
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sift-schema-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sift-schema-artifact/
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
      - name: Retain source and partial generator receipts on failure
        if: failure() && steps.freeze.outcome == 'success'
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: sift-schema-failure-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/sift-schema-artifact/source-manifest.json
            ${{ runner.temp }}/sift-schema-artifact/generator-*-result.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
